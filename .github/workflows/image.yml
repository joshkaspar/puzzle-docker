name: image

# Builds the Flutter web app and the nginx image in CI, so hosts only pull the
# small final image and never the multi-GB Flutter build image.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned upstream ref
        id: ref
        run: |
          ref=$(sed -n 's/^ARG PUZZLE_REF=//p' Dockerfile)
          test -n "$ref"
          echo "short=${ref:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ref.outputs.short }}
            ghcr.io/${{ github.repository }}:latest
