name: image

# Builds the Flutter web app and the nginx image in CI, so hosts only pull the
# small final image and never the multi-GB Flutter build image.
on:
  push:
    branches: [main]
    # Only files that go into the image; docs or Dependabot config changes
    # shouldn't rebuild and overwrite the current tag.
    paths:
      - Dockerfile
      - nginx.conf
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tag = <upstream commit>-n<nginx minor>, e.g. 3e70679-n1.30, so a base-image
      # bump gets a new tag instead of overwriting the one a host is running.
      - name: Compute image tag
        id: ref
        run: |
          ref=$(sed -n 's/^ARG PUZZLE_REF=//p' Dockerfile)
          nginx=$(sed -n 's/^FROM nginx:\([0-9]*\.[0-9]*\)-alpine.*/\1/p' Dockerfile)
          test -n "$ref" && test -n "$nginx"
          echo "tag=${ref:0:7}-n${nginx}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ref.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
