version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Bumps the nginx base in the Dockerfile. The Flutter build image comes from a
  # build arg, which Dependabot doesn't follow.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd minors are nginx mainline; stay on the stable line.
      # Docker ignore rules use Bundler requirement syntax.
      - dependency-name: nginx
        versions:
          - ">= 1.31, < 1.32"
          - ">= 1.33, < 1.34"
          - ">= 1.35, < 1.36"
          - ">= 1.37, < 1.38"
          - ">= 1.39, < 1.40"
