server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entry points so upgrades take effect immediately.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Hashed/static build assets can be cached for a long time.
    location ~* \.(js|wasm|png|ico|ttf|otf|woff2?|json)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types application/javascript application/wasm application/json text/css font/ttf;
}
