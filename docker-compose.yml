# Host-specific settings come from .env (see .env.example). The tag is pinned to an
# upstream commit, so a new CI build never changes what a host runs until you bump it.
services:
  puzzle:
    image: ghcr.io/joshkaspar/puzzle-docker:${PUZZLE_TAG:-e546bf4-n1.30}
    container_name: ${PUZZLE_CONTAINER_NAME:-puzzle}
    ports:
      - "${PUZZLE_BIND:-0.0.0.0}:${PUZZLE_PORT:-8095}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PUZZLE_MEM_LIMIT:-128m}
